version: '3.8'

services:
  # 1️⃣ Zookeeper
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"

  # 2️⃣ Kafka
  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092  # ✅ 로컬(호스트)에서 접근 가능하게 설정
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG_RETENTION_HOURS: 168  # 로그 유지 기간 (7일)
      KAFKA_LOG_SEGMENT_BYTES: 1073741824 # 세그먼트 크기 설정 (1GB)
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M" # Kafka JVM Heap 설정
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # 자동 토픽 생성 활성화
    depends_on:
      - zookeeper

  # 3️⃣ Kafka UI (Kafdrop)
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    restart: always
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "PLAINTEXT://localhost:9092"  # ✅ Kafdrop도 로컬에서 Kafka를 찾도록 변경
    depends_on:
      - kafka
