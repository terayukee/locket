server:
  port: 8082

DB:
  URL_USER: ${DB_URL_USER}
  USERNAME: ${DB_USERNAME}
  PASSWORD: ${DB_PASSWORD}

spring:
  config:
    activate:
      on-profile: prod

  kafka:
    consumer:
      group-id: user-service-group-prod

  datasource:
    url: ${DB_URL_USER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate  # 배포 환경에서는 스키마 자동 변경 방지
    show-sql: false  # SQL 로그 비활성화 (성능 최적화)

  data:
    redis:
      host: j12d204.p.ssafy.io
      port: 6379
      password: ${REDIS_PASSWORD}

eureka:
  instance:
    instance-id: ${HOSTNAME}:${spring.application.name}:${server.port}
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, gateway, readiness, liveness
  endpoint:
    prometheus:
      enabled: true
    gateway:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
