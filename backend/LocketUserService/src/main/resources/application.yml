server:
  port: 0  # ✅ 랜덤 포트 사용 (Eureka 등록 시 문제 방지)

spring:
  application:
    name: user-service

  kafka:    
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service-group  # ✅ 유저 서비스 전용 컨슈머 그룹
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest  # ✅ 처음부터 읽기
      properties:
        spring.json.trusted.packages: "*"  # ✅ JSON 변환 허용 패키지 지정
    listener:
      ack-mode: manual  # ✅ 수동 커밋 설정 (필요 시 변경)

eureka:
  instance:
    hostname: user-service  # ✅ Eureka 등록 시 서비스 이름으로 등록
    prefer-ip-address: false  # ✅ hostname 기반 등록
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

springdoc:
  api-docs:
    enabled: true
    path: /api/user/v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
