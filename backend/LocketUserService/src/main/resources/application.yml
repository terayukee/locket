server:
  port: 0  # 랜덤 포트 사용

spring:
  application:
    name: user-service
  profiles:
    active: dev
    include: key  # application-key.yml 포함 (DB, Kafka 정보) 

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # 필요에 따라 변경 가능

  kafka:
    bootstrap-servers: ${KAFKA.BOOTSTRAP-SERVERS}
    consumer:
      group-id: ${KAFKA.CONSUMER.USER-GROUP-ID}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual_immediate


  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000

  data:
    redis:
      host: j12d204.p.ssafy.io
      port: 6379
      password: ${REDIS.PASSWORD}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

springdoc:
  api-docs:
    enabled: true
    path: /api/users/v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json



jwt:
  secret: ${JWT_SECRET:my-secret-jwt-key-for-dev-only}
  access-exp: ${JWT_ACCESS_EXP:86400000}   # 24시간
  refresh-exp: ${JWT_REFRESH_EXP:604800000} # 7일
