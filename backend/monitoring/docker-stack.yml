version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8084:8080"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - monitoring

  spring-locket-discovery:
    image: maru1203/spring-locket-discovery:latest
    ports:
      - "8761:8761"
    networks:
      - monitoring

  spring-locket-user-service:
    image: maru1203/spring-locket-user-service:latest
    ports:
      - "8082:8082"
    networks:
      - monitoring

  spring-locket-payment-service:
    image: maru1203/spring-locket-payment-service:latest
    ports:
      - "8081:8081"
    networks:
      - monitoring

  spring-locket-api-gateway:
    image: maru1203/spring-locket-api-gateway:latest
    ports:
      - "8080:8080"
    networks:
      - monitoring

  spring-locket-elasticsearch:
    image: maru1203/spring-locket-elasticsearch:latest
    ports:
      - "8083:8083"
    networks:
      - monitoring

networks:
  monitoring:
    external: true
