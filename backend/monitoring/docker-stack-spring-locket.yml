version: '3.8'

services:
  discovery:
    image: maru1203/spring-locket-discovery:latest
#    ports:
#      - "8761:8761"
    networks:
      - spring-locket

  user-service:
    image: maru1203/spring-locket-user-service:latest
#    ports:
#      - "8082:8082"
    networks:
      - spring-locket
    depends_on:
      - discovery

  payment-service:
    image: maru1203/spring-locket-payment-service:latest
#    ports:
#      - "8081:8081"
    networks:
      - spring-locket

  api-gateway:
    image: maru1203/spring-locket-api-gateway:latest
#    ports:
#      - "8080:8080"
    networks:
      - spring-locket

  elasticsearch:
    image: maru1203/spring-locket-elasticsearch:latest
#    ports:
#      - "8083:8083"
    networks:
      - spring-locket

networks:
  spring-locket:
    external: true
