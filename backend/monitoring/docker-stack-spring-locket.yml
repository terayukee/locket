version: '3.8'

services:
  discovery:
    image: maru1203/spring-locket-discovery:latest
#    hostname: "spring-locket-discovery"
    ports:
      - "8761:8761"
    networks:
      - spring-locket
      - monitoring

  user-service:
    image: maru1203/spring-locket-user-service:latest
#    hostname: "spring-locket-user-service"
    ports:
      - "8082:8082"
    networks:
      - spring-locket
      - monitoring
    depends_on:
      - discovery

  payment-service:
    image: maru1203/spring-locket-payment-service:latest
#    hostname: "spring-locket-payment-service"
    ports:
      - "8081:8081"
    networks:
      - spring-locket
      - monitoring

  api-gateway:
    image: maru1203/spring-locket-api-gateway:latest
#    hostname: "spring-locket-api-gateway"
    ports:
      - "8080:8080"
    networks:
      - spring-locket
      - monitoring

  elasticsearch:
    image: maru1203/spring-locket-elasticsearch:latest
#    hostname: "spring-locket-elasticsearch"
    ports:
      - "8083:8083"
    networks:
      - spring-locket
      - monitoring

  ai-service:
    image: maru1203/spring-locket-ai-service:latest
    ports:
      - "8500:8500"
    environment:
      - PORT=8500
      - SERVICE_NAME=LOCKET-AI-SERVICE
      - EUREKA_SERVER=http://discovery:8761/eureka
      - CLOVA_OCR_URL=YOUR_ACTUAL_URL
      - CLOVA_OCR_SECRET=YOUR_ACTUAL_SECRET
      - OPENAI_API_KEY=YOUR_ACTUAL_KEY
    volumes:
      - /home/ubuntu/models:/app/app/domain/category/model
    networks:
      - spring-locket
    depends_on:
      - discovery

networks:
  spring-locket:
    external: true
  monitoring:
    external: true
