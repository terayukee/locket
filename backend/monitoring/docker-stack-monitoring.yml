version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - /home/ubuntu/S12P21D204/backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - spring-locket
      - shared-net

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    networks:
      - monitoring
      - spring-locket
      - shared-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8084:8080"
    networks:
      - monitoring
      - spring-locket
      - shared-net

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - monitoring
      - spring-locket
      - shared-net

networks:
  monitoring:
    external: true
  spring-locket:
    external: true
  shared-net:
    external: true
