server:
  port: 8083

ELASTICSEARCH:
  URIS: ${ELASTICSEARCH_URIS}
  USERNAME: ${ELASTICSEARCH_USERNAME}
  PASSWORD: ${ELASTICSEARCH_PASSWORD}

spring:
  config:
    activate:
      on-profile: prod

  kafka:
    consumer:
      group-id: elastic-service-group-prod

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}

eureka:
  instance:
    instance-id: ${HOSTNAME}:${spring.application.name}:${server.port}
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://j12d204.p.ssafy.io:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, gateway, readiness, liveness
  endpoint:
    prometheus:
      enabled: true
    gateway:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

#springdoc:
#  api-docs:
#    enabled: true
#    path: /elasticsearch-docs
#  swagger-ui:
#    path: /elasticsearch-docs/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
    #    path: /elasticsearch-docs
    path: /api/elasticsearch/v3/api-docs
  swagger-ui:
    #    path: /elasticsearch-docs/swagger-ui.html
    enabled: true
    path: /elasticsearch-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
