  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config

swagger:
  server-url: https://j12d204.p.ssafy.io/api/elasticsearch