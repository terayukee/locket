spring:
  config:
    activate:
      on-profile: prod

  application:
    name: locket-api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders: "Authorization, Content-Disposition"
      routes:
        # 서비스 라우팅
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment
          filters:
            - StripPrefix=1

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users
          filters:
            - StripPrefix=1
          order: 100

        - id: elasticsearch-service
          uri: lb://ELASTICSEARCH-SERVICE
          predicates:
            - Path=/api/elasticsearch
          filters:
            - StripPrefix=1

        # 서비스별 Swagger 문서 라우팅
        - id: payment-service-docs
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment/v3/api-docs/**
          filters:
            - StripPrefix=2
#            - RewritePath=/api/payment/v3/api-docs(?<segment>/?.*), /payment-docs${segment}
#            - RewritePath=/api/payment/v3/api-docs, /payment-docs
            - RewritePath=/v3/api-docs(?<segment>/?.*), /payment-docs${segment}
            - RewritePath=/v3/api-docs, /payment-docs

        - id: user-service-docs
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/v3/api-docs
          filters:
            - StripPrefix=2
#            - RewritePath=/api/users/v3/api-docs(?<segment>/?.*), /users-docs${segment}
#            - RewritePath=/api/users/v3/api-docs, /users-docs
            - RewritePath=/v3/api-docs(?<segment>/?.*), /users-docs${segment}
            - RewritePath=/v3/api-docs, /users-docs
          order: 1

        - id: elasticsearch-service-docs
          uri: lb://ELASTICSEARCH-SERVICE
          predicates:
            - Path=/api/elasticsearch/v3/api-docs
          filters:
            - StripPrefix=2
#            - RewritePath=/api/elasticsearch/v3/api-docs(?<segment>/?.*), /elasticsearch-docs${segment}
#            - RewritePath=/api/elasticsearch/v3/api-docs, /elasticsearch-docs
            - RewritePath=/v3/api-docs(?<segment>/?.*), /elasticsearch-docs${segment}
            - RewritePath=/v3/api-docs, /elasticsearch-docs

eureka:
  instance:
    instance-id: ${HOSTNAME}:${spring.application.name}:${server.port}
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://j12d204.p.ssafy.io:8761/eureka

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: "Locket Payment Service"
        url: https://j12d204.p.ssafy.io/api/payment/v3/api-docs
      - name: "Locket User Service"
        url: https://j12d204.p.ssafy.io/api/users/v3/api-docs
      - name: "Locket ElasticSearch Service"
        url: https://j12d204.p.ssafy.io/api/elasticsearch/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, gateway, readiness, liveness, info
  endpoint:
    prometheus:
      enabled: true
    gateway:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG
