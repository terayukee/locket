spring:
  config:
    activate:
      on-profile: prod

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://j12d204.p.ssafy.io:8761/eureka  # ✅ EC2 도메인 적용

server:
  port: 8080

# ✅ 원격 서버에서 실행할 API 문서 경로
springdoc:
  swagger-ui:
    urls:
      - name: "Locket Payment Service"
        url: http://j12d204.p.ssafy.io:8081/api/payment/v3/api-docs
      - name: "Locket User Service"
        url: http://j12d204.p.ssafy.io:8082/api/user/v3/api-docs
      - name: "Locket ElasticSearch Service"  # ✅ Elasticsearch 추가
        url: http://j12d204.p.ssafy.io:8083/api/elasticsearch/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, gateway
  endpoint:
    prometheus:
      enabled: true
    gateway:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
