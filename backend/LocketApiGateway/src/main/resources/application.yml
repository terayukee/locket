spring:
  profiles:
    active: dev # 로컬(dev) / 프로덕션(prod)

---
# ✅ 1️⃣ 로컬(dev) 환경 설정
spring:
  config:
    activate:
      on-profile: dev

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

---
# ✅ 2️⃣ 프로덕션(prod) 환경 설정
# spring:
#   config:
#     activate:
#       on-profile: prod
# eureka:
#   client:
#     register-with-eureka: true
#     fetch-registry: true
#     service-url:
#       defaultZone: http://locket-discovery:8761/eureka

---
# ✅ 3️⃣ 공통 설정
spring:
  application:
    name: locket-api-gateway

  cloud:
    gateway:
      routes:
        - id: payment-service
          uri: lb://payment-service  # 🔥 Eureka 기반으로 수정
          predicates:
            - Path=/api/payment/**

        - id: user-service
          uri: lb://user-service  # 🔥 Eureka 기반으로 수정
          predicates:
            - Path=/api/user/**

        # 🔥 Swagger API 문서를 Gateway가 프록시하도록 추가
        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/v3/api-docs

        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/api/user/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, gateway
  endpoint:
    prometheus:
      enabled: true
    gateway:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${jwt_secret_key}
  access-exp: ${jwt_access_exp}
  refresh-exp: ${jwt_refresh_exp}

---
# ✅ 4️⃣ Swagger 설정 추가
springdoc:
  api-docs:
    enabled: true
    groups.enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: "Locket Payment Service"
        url: http://localhost:8080/api/payment/v3/api-docs
      - name: "Locket User Service"
        url: http://localhost:8080/api/user/v3/api-docs
