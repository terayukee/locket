---
# 공통 설정
spring:
  application:
    name: locketapigateway-service

  cloud:
    gateway:
      routes:
        - id: Payment
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**

        - id: User
          uri: lb://user-service
          predicates:
            - Path=/api/user/**


management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${jwt_secret_key}
  access-exp: ${jwt_access_exp}
  refresh-exp: ${jwt_refresh_exp}