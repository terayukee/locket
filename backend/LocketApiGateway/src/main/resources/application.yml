spring:
  profiles:
    active: dev
  application:
    name: locket-api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
        - AddResponseHeader=Access-Control-Allow-Headers, Content-Type, Authorization, X-User-Id, X-Auth-UserId
        - PreserveHostHeader
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders: "Authorization, Content-Disposition, X-User-Id, X-Auth-UserId"
      routes:
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment/**
          filters:
            - RewritePath=/api/payment/(?<segment>.*), /${segment}
            - PreserveHostHeader
            - name: JwtGatewayFilter
              args:
                enabled: true

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/(?<segment>.*), /${segment}
            - PreserveHostHeader
            - name: JwtGatewayFilter
              args:
                enabled: true


        - id: elasticsearch-service
          uri: lb://ELASTICSEARCH-SERVICE
          predicates:
            - Path=/api/elasticsearch/**
          filters:
            - RewritePath=/api/elasticsearch/(?<segment>.*), /${segment}
            - PreserveHostHeader

        - id: locket-ai-service
#          uri: lb://LOCKET-AI-SERVICE
          uri: http://localhost:8500
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2
            - RewritePath=/api/ai/(?<segment>.*), /${segment}
            - PreserveHostHeader

        - id: payment-service-docs
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment/v3/api-docs
          filters:
            - RewritePath=/api/payment/v3/api-docs, /payment-docs

        - id: user-service-docs
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/v3/api-docs
          filters:
            - RewritePath=/api/users/v3/api-docs, /users-docs

        - id: elasticsearch-service-docs
          uri: lb://ELASTICSEARCH-SERVICE
          predicates:
            - Path=/api/elasticsearch/v3/api-docs
          filters:
            - RewritePath=/api/elasticsearch/v3/api-docs, /elasticsearch-docs

        - id: locket-ai-service-docs
#          uri: lb://LOCKET-AI-SERVICE
          uri: http://localhost:8500
          predicates:
            - Path=/api/ai/openapi.json
          filters:
            - RewritePath=/api/ai/openapi.json, /openapi.json

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, gateway
  endpoint:
    prometheus:
      enabled: true
    gateway:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyThatHasMoreThan256BitsToMeetTheSecurityRequirementsOfHMACSHA256AlgorithmUsedByJWTLibrary12345678901234567890}
  access-exp: ${JWT_ACCESS_EXP:86400000}   # 24시간
  refresh-exp: ${JWT_REFRESH_EXP:604800000} # 7일

springdoc:
  api-docs:
    enabled: true
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html