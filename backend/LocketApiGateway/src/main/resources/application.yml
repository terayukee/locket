spring:
  profiles:
    active: dev  # 기본값을 'dev'로 설정 (로컬에서는 자동 적용됨)
  application:
    name: locket-api-gateway

  cloud:
    gateway:
      routes:
        - id: payment-service
          uri: lb://payment-service  # 🔥 Eureka 기반
          predicates:
            - Path=/api/payment/**

        - id: user-service
          uri: lb://user-service  # 🔥 Eureka 기반
          predicates:
            - Path=/api/user/**

        # 🔥 Swagger API 문서를 Gateway가 프록시하도록 추가
        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/v3/api-docs

        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/api/user/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, gateway
  endpoint:
    prometheus:
      enabled: true
    gateway:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${jwt_secret_key}
  access-exp: ${jwt_access_exp}
  refresh-exp: ${jwt_refresh_exp}

springdoc:
  api-docs:
    enabled: true
    groups.enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: "Locket Payment Service"
        url: http://localhost:8080/api/payment/v3/api-docs
      - name: "Locket User Service"
        url: http://localhost:8080/api/user/v3/api-docs

