spring:
  profiles:
    active: dev #로컬(dev) / git(prod)


---
# 로컬(dev) 환경 설정
spring:
  config:
    activate:
      on-profile: dev
#    import: application-key.yml

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

