server:
  port: 0  # 랜덤 포트 사용 (Eureka 등록 후 로드밸런싱)

spring:
  application:
    name: payment-service
  config:
    import: "classpath:/application-key.yml"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
