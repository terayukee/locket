server:
  port: 8081  # 랜덤 포트 사용

spring:
  application:
    name: payment-service
  datasource:
    hikari:
      maximum-pool-size: 15   # 병렬 요청 수 대비 충분한 값
      minimum-idle: 30
      idle-timeout: 300000     # 5분
      max-lifetime: 1800000    # 30분
      connection-timeout: 3000 # 3초 (너무 길게 대기하지 않게)
  profiles:
    active: dev
    include: key  # application-key.yml 포함 (DB, Kafka 정보)

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # 필요에 따라 변경 가능

  kafka:
    bootstrap-servers: ${KAFKA.BOOTSTRAP-SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
    listener:
      ack-mode: manual

  data:
    redis:
      host: j12d204.p.ssafy.io
      port: 6379
      password: ${REDIS.PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, gateway
  endpoint:
    prometheus:
      enabled: true
    gateway:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /payment-docs/swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET:my-secret-jwt-key-for-dev-only}
  access-exp: ${JWT_ACCESS_EXP:86400000}   # 24시간
  refresh-exp: ${JWT_REFRESH_EXP:604800000} # 7일
